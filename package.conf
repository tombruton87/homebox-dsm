# Homebox on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=homebox
PKG_TITLE="Homebox"
PKG_DESC="Homebox, the home inventory for everything you own — where it is, what it cost, its receipts, manuals and warranty — in Container Manager, with a DSM window for the people who use it (sign-ups off by default, a new password shown once), what your things are worth, a DSM notification before a warranty ends, consistent backups with every photo and receipt, and updates."
APP_ID="Homebox.AppInstance"
REPO=tombruton87/homebox-dsm
SERVICES="server"
VOLUMES="data"
IMAGE_VARS="HB_IMAGE"
PORT=7745
PORTS="7745 7746 7747 8745"
HEALTH_PATH=/api/v1/status
APP_ACTIONS="signups|userpw|warranty|hbupdate"
APP_ANSWER_KEYS="OWNER_EMAIL OWNER_NAME"
APP_REQUEST_KEYS="USER_ID WARN_DAYS"
TAGLINE="home inventory"
WELCOME="Homebox keeps track of everything in your home: what you have, where it is, what it cost, and the receipts, manuals and photos that go with it — and when each warranty ends. This package runs it in Container Manager, makes your account at the first start, keeps sign-ups closed, and adds a window to DSM for the people who use it, what your things are worth, and a DSM notification before a warranty runs out."
BACKUP_WHAT="every item, location and account (a consistent copy of Homebox's SQLite database), and every photo, receipt and manual attached to them."
SITE_NOTE="The address you open Homebox at. Homebox serves plain HTTP; for HTTPS — which phones need to scan barcodes and QR labels with the camera — put DSM's reverse proxy in front, as below."
ICON_TOP="#5a8a6c"
ICON_BOTTOM="#2f5241"
ICON_LETTER="H"   # only if icon.png is missing
BETA=yes
